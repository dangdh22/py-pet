name: CI

on:
  push:
  pull_request:

# Một nhánh chỉ giữ lần chạy mới nhất.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # `npm run test:py` gọi .venv/bin/python.
      - name: Create .venv and install Python dev requirements
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # Gồm lint, typecheck, vitest, pytest, content:validate và e2e (build một lần trong webServer).
      - run: npm run check

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
