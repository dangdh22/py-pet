      - { vi: "Dùng 2 biến tích lũy: tong cộng các số chia hết cho 3, và dem đếm các số đó. Cả 2 dòng tong += i và dem += 1 nằm trong khối của if. Sau vòng lặp, chỉ chia khi dem > 0.", en: "Use 2 running variables: tong adds the numbers that can be divided by 3, and dem counts those numbers. Both lines tong += i and dem += 1 go inside the if block. After the loop, divide only when dem > 0." }
      - { vi: "Trong for i in range(a, b + 1):, viết if i % 3 == 0: với tong += i và dem += 1 thụt lề 8 dấu cách. Sau vòng lặp: if dem > 0: với print(f\"Trung bình: {tong / dem:.2f}\"), và else: với print(\"Không có số nào chia hết cho 3\").", en: "In for i in range(a, b + 1):, write if i % 3 == 0: with tong += i and dem += 1 indented by 8 spaces. After the loop: if dem > 0: with print(f\"Trung bình: {tong / dem:.2f}\"), and else: with print(\"Không có số nào chia hết cho 3\")." }
