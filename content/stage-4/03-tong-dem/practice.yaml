  - id: s4.tong-dem.c4
    type: code
    concepts: [average-zero-count, count-if]
    prompt:
      vi: "Robo tính trung bình các số chia hết cho 3, từ a đến b (có cả a và b). Ô Dữ liệu nhập có 2 dòng: số a và số b, là số nguyên dương. Hãy in ra trung bình với đúng 2 chữ số sau dấu chấm, như phần Ví dụ. Nếu không có số nào chia hết cho 3, in ra Không có số nào chia hết cho 3."
      en: "Robo works out the average of the numbers that can be divided by 3, from a to b (a and b included). The Input data box has 2 lines: the number a and the number b, positive integers. Print the average with exactly 2 digits after the decimal point, as in the Example. If no number can be divided by 3, print Không có số nào chia hết cho 3."
    starter: |
      # Viết lệnh của con ở dưới dòng này
    solution: |
      a = int(input())
      b = int(input())
      tong = 0
      dem = 0
      for i in range(a, b + 1):
          if i % 3 == 0:
              tong += i
              dem += 1
      if dem > 0:
          print(f"Trung bình: {tong / dem:.2f}")
      else:
          print("Không có số nào chia hết cho 3")
    tests:
      - input: "1\n10"
        output: "Trung bình: 6.00"
      - input: "3\n7"
        output: "Trung bình: 4.50"
        hidden: true
      - input: "4\n5"
        output: "Không có số nào chia hết cho 3"
        hidden: true
      - input: "6\n6"
        output: "Trung bình: 6.00"
        hidden: true
      - input: "10\n2"
        output: "Không có số nào chia hết cho 3"
        hidden: true
    common_wrong:
      - test: 0
        output: "Trung bình: 1.80"
        misconception: count-if
