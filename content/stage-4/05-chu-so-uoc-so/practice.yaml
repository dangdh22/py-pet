          print("Có", dem, "số nguyên tố")
    hints:
      - { vi: "Vòng lặp ngoài cho so chạy từ 2 đến n. Với mỗi so, vòng lặp trong tìm ước nhỏ nhất lớn hơn 1 như ở bài break: uoc bắt đầu là so, gặp ước thì ghi lại rồi break. break chỉ thoát vòng lặp trong, nên vòng lặp ngoài vẫn xét số tiếp theo.", en: "The outer loop lets so go from 2 to n. For each so, the inner loop looks for the smallest divisor greater than 1 as in the break lesson: uoc starts as so, and when a divisor is met it is stored and break runs. break leaves only the inner loop, so the outer loop still checks the next number." }
      - { vi: "Sau vòng lặp trong, vẫn trong vòng lặp ngoài (thụt lề 4 dấu cách): if uoc == so: với 2 dòng print(so) và dem += 1. Dòng print(\"Có\", dem, \"số nguyên tố\") sát lề trái, sau cả 2 vòng lặp.", en: "After the inner loop, still inside the outer loop (indented by 4 spaces): if uoc == so: with the 2 lines print(so) and dem += 1. The line print(\"Có\", dem, \"số nguyên tố\") is at the left edge, after both loops." }
    test_eligible: true

  - id: s4.chu-so.c5
    type: code
    concepts: [continue-skip, digit-split]
    prompt:
      vi: "Robo in ra các chữ số khác 0 của 1 số, từ phải sang trái. Ô Dữ liệu nhập có 1 dòng: số n, là số nguyên không âm. Hãy dùng vòng lặp while, và dùng continue để bỏ qua chữ số 0. Mỗi chữ số in 1 dòng, cuối cùng in ra Hết, đúng như phần Ví dụ. Với n là 0, Robo chỉ in ra Hết."
      en: "Robo prints the digits of a number that are not 0, from right to left. The Input data box has 1 line: a number n, an integer that is not negative. Use a while loop, and use continue to skip the digit 0. Print each digit on its own line, and at the end print Hết, exactly as in the Example. When n is 0, Robo prints only Hết."
    starter: |
      # Viết lệnh của con ở dưới dòng này
    solution: |
      n = int(input())
      while n > 0:
          chu_so = n % 10
          n = n // 10
          if chu_so == 0:
              continue
          print(chu_so)
      print("Hết")
    tests:
      - input: "10203"
        output: |
          3
          2
          1
          Hết
      - input: "0"
        output: "Hết"
        hidden: true
      - input: "7"
        output: |
          7
          Hết
        hidden: true
      - input: "100"
        output: |
          1
          Hết
        hidden: true
      - input: "5050"
        output: |
          5
          5
          Hết
        hidden: true
    common_wrong:
      - test: 0
        output: |
          3
          Hết
        misconception: continue-skip
        sample: |
          n = int(input())
          while n > 0:
              chu_so = n % 10
              n = n // 10
              if chu_so == 0:
                  break
              print(chu_so)
          print("Hết")
    hints:
      - { vi: "Mỗi lần lặp, cất chữ số cuối vào 1 biến, rồi bỏ nó khỏi n bằng n = n // 10 ngay sau đó, trước dòng continue. Nếu dòng n = n // 10 nằm sau continue, nó bị bỏ qua khi gặp chữ số 0, và vòng lặp chạy mãi.", en: "On each pass, store the last digit in a variable, then drop it from n with n = n // 10 right after that, before the continue line. If the line n = n // 10 comes after continue, it is skipped when a 0 digit comes, and the loop runs forever." }
      - { vi: "Trong while n > 0:, có 4 phần thụt lề 4 dấu cách: chu_so = n % 10, n = n // 10, if chu_so == 0: với continue thụt lề 8 dấu cách, rồi print(chu_so). Cuối cùng, sát lề trái: print(\"Hết\").", en: "Inside while n > 0:, there are 4 parts indented by 4 spaces: chu_so = n % 10, n = n // 10, if chu_so == 0: with continue indented by 8 spaces, then print(chu_so). Last, at the left edge: print(\"Hết\")." }
    test_eligible: true

  - id: s4.chu-so.c6
    type: code
    concepts: [divisor-loop, accumulator-init]
    prompt:
      vi: "Số hoàn hảo là số bằng tổng các ước của nó, không tính chính nó. Ví dụ, 6 = 1 + 2 + 3. Ô Dữ liệu nhập có 1 dòng: số n, là số nguyên từ 1 đến 1000. Hãy dùng vòng lặp for để tính tổng các ước nhỏ hơn n, rồi in ra đúng 1 dòng như phần Ví dụ: n là số hoàn hảo, hoặc n không phải là số hoàn hảo."
      en: "A perfect number is a number that equals the sum of its divisors, not counting itself. For example, 6 = 1 + 2 + 3. The Input data box has 1 line: a number n, an integer from 1 to 1000. Use a for loop to work out the sum of the divisors smaller than n, then print exactly 1 line as in the Example: n là số hoàn hảo (n is a perfect number), or n không phải là số hoàn hảo (n is not a perfect number)."
    starter: |
      # Viết lệnh của con ở dưới dòng này
    solution: |
      n = int(input())
      tong = 0
      for i in range(1, n):
          if n % i == 0:
              tong += i
      if tong == n:
          print(n, "là số hoàn hảo")
      else:
          print(n, "không phải là số hoàn hảo")
    tests:
      - input: "6"
        output: "6 là số hoàn hảo"
      - input: "1"
        output: "1 không phải là số hoàn hảo"
        hidden: true
      - input: "2"
        output: "2 không phải là số hoàn hảo"
        hidden: true
      - input: "28"
        output: "28 là số hoàn hảo"
        hidden: true
      - input: "12"
        output: "12 không phải là số hoàn hảo"
        hidden: true
      - input: "496"
        output: "496 là số hoàn hảo"
        hidden: true
      - input: "500"
        output: "500 không phải là số hoàn hảo"
        hidden: true
    common_wrong:
      - test: 0
        output: "6 không phải là số hoàn hảo"
        misconception: divisor-loop
        sample: |
          n = int(input())
          tong = 0
          for i in range(1, n + 1):
              if n % i == 0:
                  tong += i
          if tong == n:
              print(n, "là số hoàn hảo")
          else:
              print(n, "không phải là số hoàn hảo")
    hints:
      - { vi: "Không tính chính n, nên i chỉ chạy từ 1 đến n - 1: con dùng range(1, n). Đặt tong = 0 trước vòng lặp, và cộng i vào tong khi n % i == 0. Sau vòng lặp, so sánh tong với n.", en: "n itself does not count, so i only goes from 1 to n - 1: use range(1, n). Set tong = 0 before the loop, and add i to tong when n % i == 0. After the loop, compare tong with n." }
      - { vi: "Chương trình: n = int(input()), tong = 0, for i in range(1, n):, if n % i == 0: thụt lề 4 dấu cách, tong += i thụt lề 8 dấu cách. Sau vòng lặp: if tong == n: in ra là số hoàn hảo, else: in ra không phải là số hoàn hảo.", en: "The program: n = int(input()), tong = 0, for i in range(1, n):, if n % i == 0: indented by 4 spaces, tong += i indented by 8 spaces. After the loop: if tong == n: print là số hoàn hảo, else: print không phải là số hoàn hảo." }
