# Thứ tự trong file là độ ưu tiên: mục cụ thể đặt trước mục chung của cùng loại lỗi.
# Biểu thức chính quy dùng cú pháp JavaScript: nhóm có tên là (?<ten>...).
# Biến dùng được trong explain/hint: {line}, {type}, {message}, các nhóm có tên, và {suggestion} (check similar-name).

- id: missing-colon
  match: { type: SyntaxError, message: "^expected ':'$" }
  misconception: if-colon
  explain:
    vi: "Dòng {line}: Python cần 1 dấu hai chấm (:) ở cuối dòng này. Dòng mở đầu 1 khối lệnh, như dòng if hay dòng else, luôn kết thúc bằng dấu hai chấm. Khi con học vòng lặp, dòng for và dòng while cũng vậy."
    en: "Line {line}: Python needs a colon (:) at the end of this line. A line that starts a block, like an if line or an else line, always ends with a colon. When you learn loops, for lines and while lines do too."
  hint:
    vi: "Thêm dấu : vào cuối dòng {line}. Nếu đó là dòng else, hãy xóa phần điều kiện và chỉ để lại else:, vì else không có điều kiện. Nếu con cần thêm 1 điều kiện, hãy viết elif thay cho else if."
    en: "Add : at the end of line {line}. If it is an else line, delete the condition and keep only else:, because else has no condition. If you need to add another condition, write elif instead of else if."
  sample: "if True\n    print(1)"

- id: elif-after-else
  match: { type: SyntaxError, message: "^'elif' block follows an 'else' block$" }
  misconception: elif-chain
  explain:
    vi: "Dòng {line}: dòng elif này đứng sau 1 nhánh else. Trong 1 chuỗi, if đứng đầu, các elif ở giữa, và else luôn đứng cuối cùng."
    en: "Line {line}: this elif line comes after an else branch. In a chain, the if comes first, the elifs are in the middle, and the else always comes last."
  hint:
    vi: "Chuyển dòng else: và các dòng thụt lề của nó xuống dưới cùng, sau mọi nhánh elif."
    en: "Move the line else: and its indented lines to the very bottom, after every elif branch."
  sample: "if True:\n    print(1)\nelse:\n    print(2)\nelif False:\n    print(3)"

- id: indent-expected
  match: { type: IndentationError, message: "^expected an indented block after .+ on line (?<header>\\d+)$" }
  misconception: indent-block
  explain:
    vi: "Dòng {line}: dòng này phải thụt lề thêm 4 dấu cách so với dòng {header}, vì nó nằm trong khối lệnh của dòng {header}."
    en: "Line {line}: indent this line 4 spaces more than line {header}. It is inside the block of line {header}."
  sample: "if True:\nprint(1)"

- id: indent-unexpected
  match: { type: IndentationError, message: "^unexpected indent$" }
  explain:
    vi: "Dòng {line} bị thụt lề thừa. Nếu dòng này không nằm trong khối lệnh nào, hãy xóa hết dấu cách ở đầu dòng. Nếu nó nằm trong 1 khối lệnh, hãy cho nó thẳng hàng với các dòng khác trong khối."
    en: "Line {line} has extra indentation. If this line is not inside a block, delete all the spaces at the start of the line. If it is inside a block, line it up with the other lines of the block."
  sample: "print(1)\n    print(2)"

- id: indent-unmatched
  match: { type: IndentationError, message: "^unindent does not match any outer indentation level$" }
  misconception: indent-block
  explain:
    vi: "Dòng {line}: thụt lề không khớp với các dòng phía trên. Mỗi mức thụt lề nên dùng đúng 4 dấu cách."
    en: "Line {line}: the indentation does not match the lines above. Use exactly 4 spaces for each level."
  sample: "if True:\n        print(1)\n    print(2)"

- id: tab-error
  match: { type: TabError }
  misconception: indent-block
  explain:
    vi: "Dòng {line}: code trộn lẫn phím Tab và dấu cách khi thụt lề. Hãy xóa phần thụt lề và gõ lại bằng 4 dấu cách."
    en: "Line {line}: the code mixes Tab and spaces for indentation. Delete the indentation and type 4 spaces again."
  sample: "if True:\n        print(1)\n\tprint(2)"

- id: smart-quote
  match: { type: SyntaxError, message: "^invalid character '(?<char>.)' \\(U\\+(?<code>[0-9A-F]+)\\)$" }
  misconception: string-quotes
  explain:
    vi: "Dòng {line}: có ký tự lạ {char}. Có thể con đã dán dấu nháy cong từ Word hoặc trang web. Hãy xóa và gõ lại dấu nháy thẳng \" bằng bàn phím."
    en: "Line {line}: the character {char} is not allowed. Maybe you pasted a curly quote from Word or a web page. Delete it and type a straight quote \" with the keyboard."
  sample: "print(“Xin chào”)"

- id: unterminated-string
  match: { type: SyntaxError, message: "^unterminated (triple-quoted )?string literal" }
  misconception: string-quotes
  explain:
    vi: "Dòng {line}: chuỗi chưa có dấu nháy đóng. Mở chuỗi bằng dấu nháy nào thì phải đóng bằng đúng dấu nháy đó. Nếu bên trong chuỗi có 1 dấu nháy cùng loại, như It's, hãy bao ngoài chuỗi bằng loại dấu nháy còn lại."
    en: "Line {line}: the string has no closing quote. Close the string with the same quote that opens it. If the string has 1 quote of the same type inside it, like It's, put the other type of quote around the string."
  hint:
    vi: "Ví dụ đúng: print(\"Xin chào\")"
    en: "Correct example: print(\"Hello\")"
  sample: "print(\"Xin chào)"

- id: paren-never-closed
  match: { type: SyntaxError, message: "^'(?<paren>[(\\[{])' was never closed$" }
  explain:
    vi: "Dòng {line}: dấu {paren} đã mở nhưng chưa được đóng."
    en: "Line {line}: the bracket {paren} opens but does not close."
  sample: "print(\"Robo\""

- id: paren-unmatched
  match: { type: SyntaxError, message: "^unmatched '(?<paren>[)\\]}])'$" }
  explain:
    vi: "Dòng {line}: thừa dấu {paren}, không có dấu mở tương ứng."
    en: "Line {line}: there is an extra {paren} with no opening bracket."
  sample: "print(\"Robo\"))"

- id: print-no-paren
  match: { type: SyntaxError, message: "^Missing parentheses in call to 'print'" }
  misconception: print-call
  explain:
    vi: "Dòng {line}: lệnh print cần dấu ngoặc tròn, ví dụ print(\"Robo\")."
    en: "Line {line}: print needs round brackets, for example print(\"Robo\")."
  sample: "print \"Robo\""

- id: assign-in-condition
  match: { type: SyntaxError, message: "Maybe you meant '==' (or ':=' )?instead of '='", check: assign-in-condition }
  misconception: eq-vs-assign
  explain:
    vi: "Dòng {line}: trong điều kiện, so sánh bằng phải viết == (2 dấu bằng). Một dấu = dùng để gán giá trị."
    en: "Line {line}: in a condition, write == (2 equal signs) to compare. One = gives a value to a variable."
  sample: "x = 5\nif x = 5:\n    print(x)"

- id: assign-in-if
  match: { type: SyntaxError, message: "^invalid syntax$", check: assign-in-if }
  misconception: eq-vs-assign
  explain:
    vi: "Dòng {line}: trong điều kiện có 1 dấu = đứng 1 mình. Để so sánh bằng, con viết == (2 dấu bằng). Một dấu = dùng để gán giá trị cho biến, không dùng để so sánh."
    en: "Line {line}: the condition has a single = on its own. To compare for equal, write == (2 equal signs). One = gives a value to a variable. It is not used to compare."
  hint:
    vi: "Nếu điều kiện nối nhiều phép so sánh bằng and hoặc or, hãy kiểm tra từng phép so sánh. Ví dụ đúng: if n % 4 == 0 and n % 100 != 0:"
    en: "If the condition joins several comparisons with and or or, check each comparison. Correct example: if n % 4 == 0 and n % 100 != 0:"
  sample: "n = 4\nif n % 4 == 0 and n % 100 = 0:\n    print(1)"

- id: assign-in-call
  match: { type: SyntaxError, message: "expression cannot contain assignment, perhaps you meant \"==\"\\?" }
  misconception: eq-vs-assign
  explain:
    vi: "Dòng {line}: trong dấu ngoặc có 1 dấu = đứng sau 1 thứ không phải tên tham số như sep hay end. Nếu con muốn in cả dấu = ra màn hình, hãy đặt nó trong dấu nháy, ví dụ print(\"6 * 7 =\", 6 * 7). Muốn hỏi 2 giá trị có bằng nhau không, hãy viết == (2 dấu bằng), ví dụ print(so % 2 == 0). Nếu con muốn viết >= hay <=, hãy đặt dấu = ở sau, không đặt ở trước."
    en: "Line {line}: inside the brackets there is an = after something that is not an option name like sep or end. If you want to print the = sign itself on the screen, put it inside quotes, for example print(\"6 * 7 =\", 6 * 7). To ask whether 2 values are equal, write == (2 equal signs), for example print(so % 2 == 0). If you want to write >= or <=, put the = after the other sign, not before it."
  sample: "print(5 = 5)"

- id: quote-inside-string
  match: { type: SyntaxError, message: "Is this intended to be part of the string\\?" }
  explain:
    vi: "Dòng {line}: Python thấy 1 chuỗi đã đóng, rồi gặp chữ nằm ngoài dấu nháy. Có 2 lý do hay gặp. Nếu bên trong chuỗi có dấu nháy cùng loại với dấu nháy bao ngoài, hãy bao ngoài bằng loại dấu nháy còn lại, hoặc đặt dấu \\ ngay trước dấu nháy bên trong. Nếu chữ đó không thuộc chuỗi, có thể con quên dấu phẩy hoặc dấu + ở trước hoặc sau nó."
    en: "Line {line}: Python sees a string that has ended, and then a word outside the quotes. There are 2 common reasons. If the string has a quote inside of the same type as the quotes around it, put the other type of quote around the string, or put a \\ right before the quote inside. If the word is not part of the string, maybe a comma or a + is missing before or after it."
  sample: "print(\"Robo nói: \"Chào\"\")"

- id: missing-comma
  match: { type: SyntaxError, message: "Perhaps you forgot a comma\\?" }
  explain:
    vi: "Dòng {line}: Python thấy 2 thứ đứng cạnh nhau mà không có gì ngăn cách. Nếu đó là chữ cần in ra, hãy đặt cả câu trong 1 cặp dấu nháy, ví dụ print(\"Xin chào Robo\"). Nếu bên trong chuỗi có dấu nháy cùng loại, hãy bao ngoài bằng loại dấu nháy còn lại. Nếu đó là nhiều giá trị, hãy ngăn cách chúng bằng dấu phẩy."
    en: "Line {line}: Python sees 2 things next to each other with nothing between them. If it is text to print, put the whole sentence inside 1 pair of quotes, for example print(\"Hello Robo\"). If the string has a quote of the same type inside it, put the other type of quote around the string. If they are several values, separate them with commas."
  sample: "print(\"a\" \"b\" 1)"

- id: invalid-decimal
  match: { type: SyntaxError, message: "^invalid decimal literal$" }
  explain:
    vi: "Dòng {line}: số và chữ bị viết liền nhau. Tên biến không được bắt đầu bằng số, còn phép nhân phải có dấu *, ví dụ 2*y."
    en: "Line {line}: a number and letters are written together. A variable name cannot start with a number, and multiplication needs *, for example 2*y."
  sample: "x = 2y"

- id: keyword-before-value
  match: { type: SyntaxError, message: "^positional argument follows keyword argument" }
  misconception: named-option-order
  explain:
    vi: "Dòng {line}: phần có dấu =, như sep=... hay end=..., phải viết sau tất cả các giá trị cần in. Hãy chuyển nó xuống cuối, ngay trước dấu ) đóng, ví dụ print(\"A\", \"B\", sep=\"-\")."
    en: "Line {line}: a part with =, such as sep=... or end=..., must come after all the values to print. Move it to the end, just before the closing ), for example print(\"A\", \"B\", sep=\"-\")."
  sample: "print(sep=\"-\", \"A\", \"B\")"

- id: assign-to-literal
  match: { type: SyntaxError, message: "^cannot assign to literal" }
  misconception: var-assign
  explain:
    vi: "Dòng {line}: bên trái dấu = phải là 1 tên biến, không phải 1 số hay 1 chuỗi. Dấu = cất giá trị ở bên phải vào biến ở bên trái, nên con viết diem = 5, không viết ngược thành 5 = diem."
    en: "Line {line}: the left side of = must be a variable name, not a number or a string. = stores the value on the right in the variable on the left, so write score = 5, not the other way round as 5 = score."
  hint:
    vi: "Trong lệnh gán, tên biến đứng bên trái dấu =, giá trị đứng bên phải."
    en: "In an assignment, the variable name goes on the left of =, and the value goes on the right."
  sample: "5 = diem"

- id: syntax-other
  match: { type: SyntaxError }
  explain:
    vi: "Dòng {line}: Python không hiểu cách viết ở dòng này. Hãy kiểm tra dấu ngoặc, dấu nháy và dấu hai chấm. Nếu dòng này có tên biến, hãy kiểm tra cả tên biến: tên chỉ gồm chữ cái, chữ số và dấu gạch dưới _, không có dấu cách."
    en: "Line {line}: Python does not understand this line. Check the brackets, the quotes and the colons. If this line has a variable name, check the name too: it has only letters, digits and the underscore _, with no spaces."
  sample: "class = 1"

- id: name-before-assign
  match: { type: NameError, message: "^name '(?<name>[^']+)' is not defined$", check: assigned-in-code }
  misconception: var-before-use
  explain:
    vi: "Dòng {line}: biến {name} được dùng trước khi được gán. Python chạy từ trên xuống: hãy đặt dòng gán {name} = ... lên trên dòng này."
    en: "Line {line}: the variable {name} is used before it is given a value. Python runs from top to bottom: put the line {name} = ... above this line."
  sample: "print(diem)\ndiem = 5"

- id: name-similar
  match: { type: NameError, message: "^name '(?<name>[^']+)' is not defined$", check: similar-name }
  misconception: case-sensitive
  explain:
    vi: "Dòng {line}: Python không biết \"{name}\" là gì. Có phải con muốn viết \"{suggestion}\" không?"
    en: "Line {line}: Python does not know \"{name}\". Did you mean \"{suggestion}\"?"
  hint:
    vi: "Kiểm tra từng chữ cái của tên. Python phân biệt chữ hoa và chữ thường, và không tự sửa lỗi gõ sai: print khác Print, cũng khác pirnt."
    en: "Check each letter of the name. Python sees upper-case and lower-case letters as different, and it does not fix typos: print is not Print, and not pirnt either."
  sample: "Print(\"Robo\")"

- id: name-undefined
  match: { type: NameError, message: "^name '(?<name>[^']+)' is not defined$" }
  misconception: string-quotes
  explain:
    vi: "Dòng {line}: Python không biết \"{name}\" là gì. Nếu là chữ cần in ra, hãy đặt trong dấu nháy: \"{name}\". Nếu là biến, con cần gán giá trị cho nó trước khi dùng."
    en: "Line {line}: Python does not know \"{name}\". If it is text to print, put it in quotes: \"{name}\". If it is a variable, give it a value before you use it."
  sample: "print(Robo)"

- id: concat-str
  match: { type: TypeError, message: "^can only concatenate str \\(not \"(?<other>\\w+)\"\\) to str$" }
  explain:
    vi: "Dòng {line}: dấu + chỉ nối được chuỗi với chuỗi, không nối được chuỗi với giá trị kiểu {other}. Muốn in chữ và số cùng nhau, hãy ngăn cách chúng bằng dấu phẩy, ví dụ print(\"Robo có\", 4). Nếu con đã học str(), con cũng có thể đổi số thành chuỗi bằng str() rồi mới nối. Nếu chuỗi là số con nhập bằng input() và con cần tính toán, hãy đổi nó thành số bằng int(), ví dụ so = int(input())."
    en: "Line {line}: + can only join a string with a string, not with a value of type {other}. To print text and a number together, separate them with a comma, for example print(\"Robo có\", 4). If you have learned str(), you can also change the number to a string with str() before you join. If the string is a number you typed with input() and you need to calculate with it, change it into a number with int(), for example so = int(input())."
  sample: "print(\"Tuổi: \" + 11)"

- id: unsupported-operand
  match: { type: TypeError, message: "^unsupported operand type\\(s\\) for (?<op>.+): '(?<left>\\w+)' and '(?<right>\\w+)'$" }
  explain:
    vi: "Dòng {line}: không dùng được phép {op} giữa kiểu {left} và kiểu {right}. Có thể một giá trị là chuỗi (str), ví dụ giá trị đọc từ input(). Nếu chuỗi đó là 1 số nguyên viết bằng chữ số, như \"12\", hãy đổi nó thành số bằng int() rồi mới tính, ví dụ so = int(input())."
    en: "Line {line}: you cannot use {op} with type {left} and type {right}. Maybe one value is a string (str), for example a value from input(). If that string is a whole number written in digits, such as \"12\", change it into a number with int() before you calculate, for example so = int(input())."
  sample: "print(1 + \"2\")"

- id: not-callable
  match: { type: TypeError, message: "^'(?<kind>\\w+)' object is not callable$" }
  explain:
    vi: "Dòng {line}: con đang dùng một giá trị kiểu {kind} như 1 lệnh, có dấu ngoặc tròn ( ) ở sau. Có thể con đã đặt tên biến trùng tên lệnh, ví dụ print = 5: từ đó print là 1 biến, không còn là lệnh in nữa. Hãy đổi tên biến đó."
    en: "Line {line}: you use a value of type {kind} as if it were a command, with round brackets ( ) after it. Maybe a variable has the same name as a command, for example print = 5: after that, print is a variable, not the print command any more. Change the name of that variable."
  sample: "print = 5\nprint(1)"

- id: compare-str-int
  match: { type: TypeError, message: "^'(?<op>[<>=!]+)' not supported between instances of '(?<left>\\w+)' and '(?<right>\\w+)'$" }
  misconception: compare-str-num
  explain:
    vi: "Dòng {line}: không so sánh được bằng phép {op} giữa kiểu {left} và kiểu {right}. Python chỉ so sánh lớn nhỏ giữa số với số, hoặc giữa chuỗi với chuỗi. Có thể một giá trị là chuỗi (str) đọc từ input(): hãy đổi nó thành số bằng int() trước khi so sánh, ví dụ tuoi = int(input())."
    en: "Line {line}: you cannot compare with {op} between type {left} and type {right}. Python compares bigger or smaller only between numbers, or between strings. Maybe one value is a string (str) from input(): change it into a number with int() before comparing, for example tuoi = int(input())."
  sample: "print(\"10\" < 9)"

- id: print-unknown-option
  match: { type: TypeError, message: "^print\\(\\) got an unexpected keyword argument '(?<name>[^']+)'$" }
  misconception: eq-vs-assign
  explain:
    vi: "Dòng {line}: trong print, Python hiểu {name}=... là 1 tham số như sep= hay end=, nhưng print không có tham số tên {name}. Nếu con muốn hỏi {name} có bằng 1 giá trị không, hãy viết == (2 dấu bằng), ví dụ print({name} == 5). Nếu con muốn dùng sep hay end, hãy kiểm tra lại cách viết."
    en: "Line {line}: inside print, Python reads {name}=... as an option like sep= or end=, but print has no option called {name}. If you want to ask whether {name} is equal to a value, write == (2 equal signs), for example print({name} == 5). If you want to use sep or end, check the spelling."
  sample: "tuoi = 11\nprint(tuoi = 11)"

- id: repeat-str-by-str
  match: { type: TypeError, message: "^can't multiply sequence by non-int of type 'str'$" }
  misconception: input-str
  explain:
    vi: "Dòng {line}: ở 2 bên dấu * đều là chuỗi (str). Python chỉ lặp lại được 1 chuỗi với 1 số nguyên, ví dụ \"*\" * 3 cho ra ***. Có thể 1 giá trị là chuỗi đọc từ input(), như \"3\": hãy đổi nó thành số nguyên bằng int(), ví dụ m = int(input())."
    en: "Line {line}: both sides of * are strings (str). Python can repeat a string only with an integer, for example \"*\" * 3 gives ***. Maybe one value is a string from input(), such as \"3\": change it into an integer with int(), for example m = int(input())."
  hint:
    vi: "Nếu cạnh dấu * ở dòng {line} là 1 số trong dấu nháy, như \"3\", hãy xóa dấu nháy. Nếu đó là 1 biến, hãy xem dòng gán giá trị cho biến: nếu dòng đó là m = input(), hãy sửa thành m = int(input())."
    en: "If the value next to * on line {line} is a number in quotes, such as \"3\", delete the quotes. If it is a variable, look at the line that gives it a value: if that line is m = input(), change it to m = int(input())."
  sample: "m = \"4\"\nprint(\"*\" * m)"

- id: str-not-integer
  match: { type: TypeError, message: "^'str' object cannot be interpreted as an integer$" }
  misconception: input-str
  explain:
    vi: "Dòng {line}: ở đây Python cần 1 số nguyên, như số trong range(), nhưng lại nhận được 1 chuỗi (str). Có thể giá trị đó là chuỗi đọc từ input(), như \"5\": hãy đổi nó thành số nguyên bằng int(), ví dụ n = int(input())."
    en: "Line {line}: Python needs an integer here, such as the number in range(), but it got a string (str). Maybe that value is a string from input(), such as \"5\": change it into an integer with int(), for example n = int(input())."
  sample: "n = \"3\"\nfor i in range(n):\n    print(i)"

- id: type-other
  match: { type: TypeError }
  explain:
    vi: "Dòng {line}: kiểu dữ liệu không phù hợp với phép tính hoặc lệnh này."
    en: "Line {line}: the data type is not correct for this operation."
  sample: "print(len(5))"

- id: int-invalid
  match: { type: ValueError, message: "^invalid literal for int\\(\\) with base 10: '(?<value>.*)'$" }
  misconception: int-invalid
  explain:
    vi: "Dòng {line}: int() không đổi được '{value}' thành số nguyên. Với chuỗi, int() chỉ nhận các chữ số của 1 số nguyên, ví dụ '12', không nhận chữ cái, dấu chấm hay dấu phẩy. Với số thực, hãy viết bằng dấu chấm, như 5.5, không viết 5,5, rồi dùng float(). Nếu chỉ cần phần nguyên, hãy đổi qua float() trước rồi mới dùng int(), ví dụ int(float(input())). Nếu chuỗi đọc từ input(), hãy kiểm tra dòng đó trong ô Dữ liệu nhập."
    en: "Line {line}: int() cannot change '{value}' into an integer. With a string, int() only takes the digits of a whole number, for example '12', not letters, a dot or a comma. For a decimal number, write it with a dot, such as 5.5, not 5,5, and use float(). If you only need the whole part, change it with float() first and then use int(), for example int(float(input())). If the string comes from input(), check that line in the Input data box."
  sample: "x = int(\"5.5\")"

- id: float-invalid
  match: { type: ValueError, message: "^could not convert string to float: '(?<value>.*)'$" }
  misconception: float-convert
  explain:
    vi: "Dòng {line}: float() không đổi được '{value}' thành số thực. Số thực trong Python dùng dấu chấm, không dùng dấu phẩy: viết 3.5, không viết 3,5. Số cũng phải viết bằng chữ số, không viết bằng chữ cái. Nếu chuỗi đọc từ input(), hãy kiểm tra dòng đó trong ô Dữ liệu nhập."
    en: "Line {line}: float() cannot change '{value}' into a decimal number. Decimal numbers in Python use a dot, not a comma: write 3.5, not 3,5. Numbers must also be written in digits, not in letters. If the string comes from input(), check that line in the Input data box."
  sample: "x = float(\"3,5\")"

- id: format-code-str
  match: { type: ValueError, message: "^Unknown format code '(?<code>.)' for object of type 'str'$" }
  misconception: input-str
  explain:
    vi: "Dòng {line}: cách in số như :.2f chỉ dùng được với số, nhưng giá trị ở đây là chuỗi (str). Nếu giá trị đọc từ input(), hãy đổi nó thành số trước khi in, ví dụ gia = float(input())."
    en: "Line {line}: a number format such as :.2f only works with numbers, but this value is a string (str). If the value comes from input(), change it into a number before you print it, for example gia = float(input())."
  sample: "gia = \"30\"\nprint(f\"{gia:.2f}\")"

- id: zero-division
  match: { type: ZeroDivisionError }
  explain:
    vi: "Dòng {line}: không thể chia cho 0."
    en: "Line {line}: you cannot divide by 0."
  sample: "print(5 / 0)"

- id: index-range
  match: { type: IndexError, message: "^(?<kind>list|string|tuple) index out of range$" }
  explain:
    vi: "Dòng {line}: vị trí con lấy vượt quá độ dài. Vị trí đầu tiên là 0, vị trí cuối cùng là độ dài trừ 1."
    en: "Line {line}: the position is outside the length. The first position is 0 and the last position is the length minus 1."
  sample: "a = [1, 2]\nprint(a[2])"

- id: eof
  match: { type: EOFError }
  explain:
    vi: "Dòng {line}: chương trình cần thêm dữ liệu nhập, nhưng ô Dữ liệu nhập đã hết dòng. Mỗi lần gọi input() đọc 1 dòng mới: con điền đủ dữ liệu vào ô Dữ liệu nhập nhé, mỗi giá trị 1 dòng."
    en: "Line {line}: the program needs more input data, but the Input data box has no more lines. Each input() call reads 1 new line: write enough data in the Input data box, 1 value on each line."
  misconception: input-one-line
  sample: "x = input()"
  sample_input: ""

- id: timeout-while
  match: { type: Timeout, check: while-loop }
  misconception: while-update
  explain:
    vi: "Code chạy lâu quá nên Robo đã dừng lại. Có thể vòng lặp while không bao giờ dừng: hãy kiểm tra xem trong mỗi lần lặp, biến trong điều kiện có được thay đổi, và có tiến dần tới chỗ làm điều kiện sai không."
    en: "The code ran too long, so Robo stopped it. Maybe the while loop never stops: check that on each pass, the variable in the condition is changed and moves closer to making the condition False."
  sample: "i = 0\nwhile i < 5:\n    i = i * 1"

- id: timeout
  match: { type: Timeout }
  explain:
    vi: "Code chạy lâu quá nên Robo đã dừng lại. Hãy kiểm tra xem có vòng lặp nào chạy quá nhiều lần không."
    en: "The code ran too long, so Robo stopped it. Check if a loop runs too many times."
  sample: "x = 0\nfor i in range(10 ** 12):\n    x = x + i"

- id: output-limit
  match: { type: OutputLimit }
  explain:
    vi: "Chương trình in ra quá nhiều nên Robo đã dừng lại. Có thể có vòng lặp in ra mãi không dừng."
    en: "The program printed too much, so Robo stopped it. Maybe a loop prints again and again without end."
  sample: "for i in range(200000):\n    print(\"Robo\")"

- id: input-prompt
  match: { type: InputPrompt }
  explain:
    vi: "Con đã viết chữ bên trong input(...). Khi chấm bài, chữ này bị tính vào kết quả nên bị sai. Hãy để trống: input()."
    en: "You wrote text inside input(...). The judge counts this text as output, so the answer is wrong. Leave it empty: input()."
  sample: "x = input(\"Nhập tên: \")\nprint(x)"
  sample_input: "Robo"
