questions:
  - id: s2.bien.b1
    type: mcq
    concepts: [var-assign]
    lessons: [s2.bien.l1]
    prompt:
      vi: "Trong Python, biến giống với thứ gì nhất?"
      en: "In Python, what is a variable most like?"
    choices:
      - { vi: "Một lệnh in chữ ra màn hình", en: "A statement that prints text on the screen", misconception: var-assign }
      - { vi: "Một phép so sánh xem 2 giá trị có bằng nhau không", en: "A check of whether 2 values are equal", misconception: var-assign }
      - { vi: "Một chuỗi luôn nằm trong dấu nháy", en: "A string that is always inside quotes", misconception: var-assign }
      - { vi: "Một chiếc hộp có dán tên, dùng để cất 1 giá trị", en: "A box with a name on it, used to store 1 value", correct: true }
    explanation:
      vi: "Biến giống chiếc hộp có dán tên. Lệnh gán cất 1 giá trị vào hộp, và sau đó con gọi tên hộp để lấy giá trị ra dùng."
      en: "A variable is like a box with a name on it. An assignment stores 1 value in the box, and then you use the name of the box to get the value back."

  - id: s2.bien.b2
    type: mcq
    concepts: [var-assign]
    lessons: [s2.bien.l1]
    prompt:
      vi: "Lệnh nào cất số 10 vào biến score?"
      en: "Which statement stores the number 10 in the variable score?"
    choices:
      - { text: "10 = score", misconception: var-assign }
      - { text: "score = 10", correct: true }
      - { text: "print(score, 10)", misconception: var-assign }
      - { text: "score + 10", misconception: var-assign }
    explanation:
      vi: "Lệnh gán viết tên biến ở bên trái, dấu =, rồi giá trị ở bên phải: score = 10. Viết ngược thành 10 = score thì Python báo lỗi, vì 10 không phải là biến."
      en: "An assignment has the variable name on the left, then =, then the value on the right: score = 10. If you write it the other way round, 10 = score, Python shows an error, because 10 is not a variable."

  - id: s2.bien.b3
    type: mcq
    concepts: [var-assign]
    lessons: [s2.bien.l1]
    prompt:
      vi: "Biến pet đang chứa chuỗi \"cat\". Lệnh nào dùng biến pet để in ra cat?"
      en: "The variable pet holds the string \"cat\". Which statement uses the variable pet to print cat?"
    choices:
      - { text: "print(\"pet\")", misconception: var-assign }
      - { text: "print(cat)", misconception: string-quotes }
      - { text: "print(pet)", correct: true }
      - { text: "print(pet = \"cat\")", misconception: var-assign }
    explanation:
      vi: "Tên biến viết không có dấu nháy, nên print(pet) lấy giá trị trong biến pet ra in: cat. Còn print(\"pet\") in y nguyên chữ pet. print(cat) báo lỗi NameError, vì cat không có dấu nháy và không có biến nào tên cat. Lệnh gán phải viết thành 1 dòng riêng, không đặt trong print được."
      en: "A variable name has no quotes, so print(pet) takes the value in the variable pet and prints it: cat. But print(\"pet\") prints the word pet exactly as it is. print(cat) shows a NameError, because cat has no quotes and there is no variable named cat. An assignment must be a line of its own; it cannot go inside print."

  - id: s2.bien.b4
    type: predict
    concepts: [var-assign]
    lessons: [s2.bien.l1]
    code: |
      5 = n
      print(n)
    prompt: { vi: "Chuyện gì xảy ra khi chạy đoạn code này?", en: "What happens when this code runs?" }
    choices:
      - { text: "5", misconception: var-assign }
      - { text: "n", misconception: var-assign }
      - { vi: "Không in gì, báo lỗi SyntaxError ở dòng 1", en: "It prints nothing and shows a SyntaxError on line 1", correct: true, error: true }
      - { vi: "Không in gì, báo lỗi NameError ở dòng 2", en: "It prints nothing and shows a NameError on line 2", error: true, misconception: syntax-error-nothing-runs }
    explanation:
      vi: "Dòng 1 viết ngược lệnh gán. Bên trái dấu = phải là tên biến, nhưng ở đây lại là số 5. Đây là lỗi cú pháp, nên Python báo SyntaxError và không chạy dòng nào."
      en: "Line 1 writes the assignment the wrong way round. The left side of = must be a variable name, but here it is the number 5. This is a syntax error, so Python shows a SyntaxError and runs no line."

  - id: s2.bien.b5
    type: mcq
    concepts: [var-name-rules]
    lessons: [s2.bien.l2]
    prompt:
      vi: "Dùng tên biến nào thì Python báo lỗi?"
      en: "Which variable name makes Python show an error?"
    choices:
      - { text: "score2" }
      - { text: "high_score" }
      - { text: "2score", correct: true }
      - { text: "Score" }
    explanation:
      vi: "Tên biến không được bắt đầu bằng chữ số, nên 2score bị lỗi. Chữ số đứng sau chữ cái thì được, như score2. Dấu gạch dưới và chữ hoa cũng được dùng trong tên."
      en: "A variable name cannot start with a digit, so 2score is an error. A digit after a letter is fine, as in score2. The underscore and upper-case letters can also be used in a name."

  - id: s2.bien.b6
    type: mcq
    concepts: [var-name-rules, case-sensitive]
    lessons: [s2.bien.l2]
    prompt:
      vi: "Với Python, score và Score có phải là cùng 1 biến không?"
      en: "To Python, are score and Score the same variable?"
    choices:
      - { vi: "Có, vì Python không để ý chữ hoa hay chữ thường", en: "Yes, because Python does not care about upper-case or lower-case letters", misconception: case-sensitive }
      - { vi: "Không, đó là 2 biến khác nhau", en: "No, they are 2 different variables", correct: true }
      - { vi: "Có, nhưng chỉ khi biến chứa số", en: "Yes, but only when the variable holds a number", misconception: case-sensitive }
      - { vi: "Không, vì Score là tên sai quy tắc nên không dùng được", en: "No, because Score breaks the rules and cannot be used", misconception: var-name-rules }
    explanation:
      vi: "Python phân biệt chữ hoa và chữ thường, nên score và Score là 2 biến khác nhau. Tên Score vẫn đúng quy tắc, nhưng nên viết tên biến bằng chữ thường để khỏi nhầm."
      en: "Python sees upper-case and lower-case letters as different, so score and Score are 2 different variables. The name Score follows the rules, but it is better to write variable names in lower case so you do not mix them up."

  - id: s2.bien.b7
    type: predict
    concepts: [var-name-rules, case-sensitive]
    lessons: [s2.bien.l2]
    code: |
      total = 5
      print(Total)
    prompt: { vi: "Chuyện gì xảy ra khi chạy đoạn code này?", en: "What happens when this code runs?" }
    choices:
      - { text: "5", misconception: case-sensitive }
      - { text: "Total", misconception: var-assign }
      - { vi: "Báo lỗi NameError ở dòng 2", en: "A NameError on line 2", correct: true, error: true }
      - { vi: "Báo lỗi SyntaxError ở dòng 1", en: "A SyntaxError on line 1", error: true, misconception: var-name-rules }
    explanation:
      vi: "Dòng 1 gán 5 cho biến total, viết thường. Dòng 2 dùng Total, có chữ T viết hoa, là 1 biến khác chưa được gán. Python không biết Total là gì nên báo lỗi NameError."
      en: "Line 1 assigns 5 to the variable total, in lower case. Line 2 uses Total, with an upper-case T, which is a different variable that has no value yet. Python does not know Total, so it shows a NameError."

  - id: s2.bien.b8
    type: mcq
    concepts: [var-name-rules]
    lessons: [s2.bien.l2]
    prompt:
      vi: "Lệnh gán nào làm cho lệnh print ở các dòng sau không dùng được nữa?"
      en: "Which assignment stops print from working on the lines after it?"
    choices:
      - { text: "score = 5" }
      - { text: "print_score = 5", misconception: var-name-rules }
      - { text: "Print2 = 5", misconception: var-name-rules }
      - { text: "print = 5", correct: true }
    explanation:
      vi: "print = 5 dùng chính tên của lệnh print làm tên biến. Từ đó trở đi, print là 1 biến chứa số 5, không còn là lệnh in nữa. Các tên như print_score hay Print2 khác tên print nên không sao."
      en: "print = 5 uses the name of the print statement as a variable name. After that, print is a variable that holds 5, not the print statement any more. Names such as print_score or Print2 are different from print, so they are fine."

  - id: s2.bien.b9
    type: mcq
    concepts: [var-name-rules]
    lessons: [s2.bien.l2]
    prompt:
      vi: "Con cần 1 biến để cất số người chơi (players) của 1 trò chơi. Tên nào dễ hiểu nhất?"
      en: "You need a variable to store the number of players in a game. Which name is the easiest to understand?"
    choices:
      - { text: "x" }
      - { text: "players", correct: true }
      - { text: "abc" }
      - { text: "p1p2p3" }
    explanation:
      vi: "Cả 4 tên đều đúng quy tắc, nhưng chỉ players cho biết biến cất gì. Tên có nghĩa giúp con và người khác đọc code dễ hơn."
      en: "All 4 names follow the rules, but only players tells what the variable stores. A name with a meaning makes the code easier to read for you and for others."

  - id: s2.bien.b10
    type: mcq
    concepts: [var-reassign]
    lessons: [s2.bien.l3]
    prompt:
      vi: "Biến n đang chứa số 3. Lệnh nào làm cho n chứa số 8?"
      en: "The variable n holds the number 3. Which statement makes n hold the number 8?"
    choices:
      - { text: "n + 5", misconception: var-reassign }
      - { text: "n = n + 5", correct: true }
      - { text: "print(n + 5)", misconception: var-reassign }
      - { text: "n = 5", misconception: var-reassign }
    explanation:
      vi: "Muốn đổi giá trị của biến, con phải gán lại. n = n + 5 tính 3 + 5 ra 8, rồi cất 8 vào n. Lệnh n + 5 chỉ tính rồi bỏ kết quả đi. print(n + 5) in ra 8, nhưng n vẫn là 3. Còn n = 5 cất số 5 vào n, thay cho số 3."
      en: "To change the value of a variable, you must assign it again. n = n + 5 works out 3 + 5 = 8, then stores 8 in n. The statement n + 5 only works it out and throws the result away. print(n + 5) prints 8, but n is still 3. And n = 5 stores the number 5 in n, in place of 3."

  - id: s2.bien.b11
    type: predict
    concepts: [var-reassign]
    lessons: [s2.bien.l3]
    code: |
      n = 2
      print(n)
      n = n + 3
      print(n)
    prompt: { vi: "Đoạn code in ra gì?", en: "What is the output of this code?" }
    choices:
      - { text: "5\n5", misconception: var-reassign }
      - { text: "2\n2", misconception: var-reassign }
      - { text: "2\n3", misconception: var-reassign }
      - { text: "2\n5", correct: true }
    explanation:
      vi: "Lệnh print ở dòng 2 chạy khi n còn là 2, nên in ra 2. Dòng 3 tính 2 + 3 ra 5 rồi cất vào n. Lệnh print ở dòng 4 in ra 5."
      en: "The print on line 2 runs while n is still 2, so it prints 2. Line 3 works out 2 + 3 = 5 and stores it in n. The print on line 4 prints 5."

  - id: s2.bien.b12
    type: predict
    concepts: [var-reassign]
    lessons: [s2.bien.l3]
    code: |
      x = 4
      y = x + 1
      x = 10
      print(y)
    prompt: { vi: "Đoạn code in ra gì?", en: "What is the output of this code?" }
    choices:
      - { text: "5", correct: true }
      - { text: "11", misconception: var-reassign }
      - { text: "4", misconception: var-reassign }
      - { text: "10", misconception: var-reassign }
    explanation:
      vi: "Dòng 2 chạy khi x là 4, nên Python tính 4 + 1 ra 5 và cất 5 vào y. Dòng 3 đổi x thành 10, nhưng không làm y thay đổi. y vẫn giữ 5."
      en: "Line 2 runs while x is 4, so Python works out 4 + 1 = 5 and stores 5 in y. Line 3 changes x to 10, but it does not change y. y still holds 5."

  - id: s2.bien.b13
    type: mcq
    concepts: [var-before-use]
    lessons: [s2.bien.l3]
    code: |
      print("Pin:", pin)
      pin = 5
    prompt:
      vi: "Đoạn code này báo lỗi NameError. Sửa thế nào để in ra Pin: 5?"
      en: "This code shows a NameError. How do you fix it so that it prints Pin: 5?"
    choices:
      - { vi: "Thêm 1 dòng pin = 5 nữa vào cuối chương trình", en: "Add one more line pin = 5 at the end of the program", misconception: var-before-use }
      - { vi: "Đặt pin trong dấu nháy: print(\"Pin:\", \"pin\")", en: "Put pin in quotes: print(\"Pin:\", \"pin\")", misconception: var-assign }
      - { vi: "Đổi chỗ 2 dòng, để dòng pin = 5 nằm trên dòng print", en: "Swap the 2 lines, so that pin = 5 is above the print line", correct: true }
      - { vi: "Đổi tên biến pin thành Pin ở cả 2 dòng", en: "Rename the variable pin to Pin on both lines", misconception: var-before-use }
    explanation:
      vi: "Python chạy từ trên xuống. Lúc dòng print chạy, biến pin chưa được gán nên Python báo lỗi. Phải đặt dòng gán pin = 5 lên trên dòng print. Thêm dòng gán ở cuối hay đổi tên biến đều không giúp gì, vì dòng print vẫn chạy trước dòng gán. Đặt pin trong dấu nháy thì in ra chữ pin, không phải số 5."
      en: "Python runs from top to bottom. When the print line runs, pin has no value yet, so Python shows an error. The assignment pin = 5 must be above the print line. Adding an assignment at the end or renaming the variable does not help, because the print line still runs before the assignment. Putting pin in quotes prints the word pin, not the number 5."

  - id: s2.bien.b14
    type: mcq
    concepts: [var-before-use]
    lessons: [s2.bien.l3]
    prompt:
      vi: "Chương trình báo lỗi NameError: name 'score' is not defined. Lý do nào có thể gây ra lỗi này?"
      en: "A program shows NameError: name 'score' is not defined. Which reason can cause this error?"
    choices:
      - { vi: "Biến score được dùng trước khi được gán giá trị", en: "The variable score is used before it gets a value", correct: true }
      - { vi: "Biến score đang chứa số 0", en: "The variable score holds the number 0", misconception: var-before-use }
      - { vi: "Biến score đã được gán lại 2 lần", en: "The variable score has been assigned twice", misconception: var-reassign }
      - { vi: "Python không cho đặt tên biến là score", en: "Python does not allow the name score for a variable", misconception: var-name-rules }
    explanation:
      vi: "NameError nghĩa là Python gặp 1 tên mà nó chưa biết. Với biến, lý do hay gặp là dùng biến trước dòng gán, hoặc gõ sai tên biến. Biến chứa số 0 hay được gán lại nhiều lần đều không gây lỗi."
      en: "NameError means Python meets a name it does not know. For a variable, the usual reasons are using it before the line that assigns it, or typing its name wrong. A variable that holds 0, or that is assigned many times, does not cause an error."

  - id: s2.bien.b15
    type: predict
    concepts: [str-vs-int, string-repeat]
    lessons: [s2.bien.l4]
    code: |
      a = "2"
      print(a * 3)
    prompt: { vi: "Đoạn code in ra gì?", en: "What is the output of this code?" }
    choices:
      - { text: "6", misconception: str-vs-int }
      - { text: "222", correct: true }
      - { text: "2 2 2", misconception: string-repeat }
      - { vi: "Báo lỗi TypeError", en: "A TypeError", error: true, misconception: str-vs-int }
    explanation:
      vi: "Biến a chứa chuỗi \"2\", không phải số 2. Chuỗi nhân với số thì được lặp lại, nên \"2\" * 3 ra 222."
      en: "The variable a holds the string \"2\", not the number 2. A string times a number is repeated, so \"2\" * 3 gives 222."

  - id: s2.bien.b16
    type: mcq
    concepts: [str-vs-int]
    lessons: [s2.bien.l4]
    code: |
      n = "12"
    prompt:
      vi: "Sau lệnh gán này, biến n chứa gì?"
      en: "After this assignment, what does the variable n hold?"
    choices:
      - { vi: "Số nguyên 12 (int)", en: "The integer 12 (int)", misconception: str-vs-int }
      - { vi: "Không gì cả, vì Python báo lỗi: chuỗi không được chứa chữ số", en: "Nothing, because Python shows an error: a string cannot hold digits", error: true, misconception: str-vs-int }
      - { vi: "Chữ n", en: "The letter n", misconception: var-assign }
      - { vi: "Một chuỗi (str) gồm 2 ký tự 1 và 2", en: "A string (str) with the 2 characters 1 and 2", correct: true }
    explanation:
      vi: "\"12\" nằm trong dấu nháy nên là 1 chuỗi, dù bên trong chỉ có chữ số. Chuỗi chứa được cả chữ số, nên lệnh gán này không lỗi. type(n) sẽ cho biết đó là str."
      en: "\"12\" is inside quotes, so it is a string, even though it has only digits. A string can hold digits, so this assignment has no error. type(n) would tell you it is a str."

  - id: s2.bien.b17
    type: predict
    concepts: [str-vs-int]
    lessons: [s2.bien.l4]
    code: |
      n = 3
      print(type(n))
      print(type("n"))
    prompt: { vi: "Đoạn code in ra gì?", en: "What is the output of this code?" }
    choices:
      - { text: "<class 'int'>\n<class 'str'>", correct: true }
      - { text: "<class 'int'>\n<class 'int'>", misconception: str-vs-int }
      - { text: "<class 'str'>\n<class 'str'>", misconception: str-vs-int }
      - { text: "<class 'str'>\n<class 'int'>", misconception: str-vs-int }
    explanation:
      vi: "Biến n chứa số 3 không có dấu nháy, nên type(n) là int. Còn \"n\" có dấu nháy, là 1 chuỗi chứ không phải biến n, nên type(\"n\") là str."
      en: "The variable n holds the number 3, with no quotes, so type(n) is int. But \"n\" has quotes: it is a string, not the variable n, so type(\"n\") is str."

  - id: s2.bien.b18
    type: predict
    concepts: [str-vs-int]
    lessons: [s2.bien.l4]
    code: |
      age = 11
      print("age:", age + 1)
    prompt: { vi: "Đoạn code in ra gì?", en: "What is the output of this code?" }
    choices:
      - { text: "age: 12", correct: true }
      - { text: "age: 111", misconception: str-vs-int }
      - { text: "age: age + 1", misconception: var-assign }
      - { text: "age:12", misconception: print-comma-space }
    explanation:
      vi: "Biến age chứa số 11, nên age + 1 là phép cộng và ra 12. Dấu phẩy thêm 1 dấu cách giữa chuỗi \"age:\" và số 12."
      en: "The variable age holds the number 11, so age + 1 is an addition: 12. The comma adds 1 space between the string \"age:\" and the number 12."

  - id: s2.bien.b19
    type: predict
    concepts: [str-vs-int]
    lessons: [s2.bien.l4]
    code: |
      a = "5"
      print(a + 1)
    prompt: { vi: "Chuyện gì xảy ra khi chạy đoạn code này?", en: "What happens when this code runs?" }
    choices:
      - { text: "6", misconception: str-vs-int }
      - { text: "51", misconception: str-vs-int }
      - { vi: "Báo lỗi TypeError ở dòng 2", en: "A TypeError on line 2", correct: true, error: true }
      - { text: "a1", misconception: var-assign }
    explanation:
      vi: "Biến a chứa chuỗi \"5\", còn 1 là số. Dấu + không nối được chuỗi với số, cũng không cộng được, nên Python báo lỗi TypeError."
      en: "The variable a holds the string \"5\", and 1 is a number. + cannot join a string with a number, and it cannot add them either, so Python shows a TypeError."

  - id: s2.bien.b20
    type: mcq
    concepts: [ai-data]
    lessons: [s2.bien.l5]
    prompt:
      vi: "Robo chụp ảnh, ghi âm giọng nói và đếm số bước chân mỗi ngày. Những thứ Robo ghi lại được gọi chung là gì?"
      en: "Robo takes photos, records voices and counts its steps every day. What do we call all the things Robo records?"
    choices:
      - { vi: "Nhãn", en: "Labels", misconception: ai-data }
      - { vi: "AI", en: "AI", misconception: ai-data }
      - { vi: "Chương trình", en: "A program" }
      - { vi: "Dữ liệu", en: "Data", correct: true }
    explanation:
      vi: "Ảnh, âm thanh và các con số mà máy ghi lại đều là dữ liệu. Nhãn chỉ là lời ghi chú đáp án gắn vào mỗi ví dụ. AI là chương trình học từ dữ liệu, còn chương trình là các lệnh, không phải những thứ được ghi lại."
      en: "Photos, sounds and the numbers a machine records are all data. A label is only a note with the right answer, added to each example. AI is a program that learns from data, and a program is a list of statements, not the things that are recorded."

  - id: s2.bien.b21
    type: mcq
    concepts: [ai-data]
    lessons: [s2.bien.l5]
    prompt:
      vi: "Để dạy AI nhận ra quả táo, người ta cho AI xem thật nhiều ảnh. Mỗi ảnh cần có thêm gì?"
      en: "To teach an AI to recognize apples, people show it a lot of photos. What does each photo need?"
    choices:
      - { vi: "Một nhãn ghi ảnh đó có phải quả táo hay không", en: "A label that says whether the photo shows an apple or not", correct: true }
      - { vi: "Không cần gì thêm, AI tự biết ảnh nào là táo", en: "Nothing more, the AI knows by itself which photos show apples", misconception: ai-data }
      - { vi: "Một nhãn ghi ngày chụp ảnh đó", en: "A label with the date the photo was taken", misconception: ai-data }
      - { vi: "Một nhãn, ghi đúng hay ghi sai cũng được", en: "A label, and it does not matter if it is right or wrong", misconception: ai-data }
    explanation:
      vi: "Nhãn cho AI biết đáp án đúng của mỗi ví dụ: ảnh này có phải quả táo hay không. Nhờ có nhãn đúng, AI học được ảnh như thế nào là quả táo. Ngày chụp ảnh không giúp AI nhận ra táo, còn nhãn ghi sai làm AI học sai."
      en: "The label tells the AI the right answer for each example: does this photo show an apple or not. With right labels, the AI learns what an apple photo looks like. The date of the photo does not help the AI recognize apples, and wrong labels make the AI learn wrong things."

  - id: s2.bien.b22
    type: mcq
    concepts: [ai-data]
    lessons: [s2.bien.l5]
    prompt:
      vi: "Khi dạy AI nhận ra mèo, nhiều ảnh con chó bị ghi nhãn nhầm là \"mèo\". Học xong, AI có thể thế nào?"
      en: "While teaching an AI to recognize cats, many dog photos are labeled \"cat\" by mistake. After learning, what can happen to the AI?"
    choices:
      - { vi: "AI tự phát hiện và sửa hết các nhãn sai", en: "The AI finds and fixes all the wrong labels by itself", misconception: ai-data }
      - { vi: "AI không bị ảnh hưởng gì, vì nó rất thông minh", en: "The AI is not affected at all, because it is very smart", misconception: ai-data }
      - { vi: "AI chạy nhanh hơn", en: "The AI runs faster", misconception: ai-data }
      - { vi: "AI dễ nhận nhầm chó thành mèo", en: "The AI often mistakes dogs for cats", correct: true }
    explanation:
      vi: "AI học đúng như dữ liệu dạy nó. Nhãn sai thì AI học sai: nó sẽ nghĩ những con chó kia cũng là mèo."
      en: "AI learns exactly what its data teaches. Wrong labels make the AI learn wrong things: it will think those dogs are cats too."

  - id: s2.bien.b23
    type: mcq
    concepts: [ai-data]
    lessons: [s2.bien.l5]
    prompt:
      vi: "Một AI nhận diện trái cây chỉ được học ảnh táo và ảnh cam. Khi xem ảnh quả xoài, AI có thể làm gì?"
      en: "A fruit-recognizing AI only learned from photos of apples and oranges. When it sees a photo of a mango, what can it do?"
    choices:
      - { vi: "Đoán sai thành táo hoặc cam, vì nó chưa từng học ảnh xoài", en: "Guess wrong, apple or orange, because it never learned from mango photos", correct: true }
      - { vi: "Chắc chắn nhận đúng là xoài", en: "Surely recognize it as a mango", misconception: ai-data }
      - { vi: "Tự biết thêm tên quả xoài mà không cần học", en: "Know the word mango by itself without learning", misconception: ai-data }
      - { vi: "Trả lời \"mình chưa học quả này\", vì AI luôn biết khi nó chưa học điều gì", en: "Answer \"I have not learned this fruit\", because an AI always knows when it has not learned something", misconception: ai-data }
    explanation:
      vi: "AI chỉ biết những gì có trong dữ liệu nó đã học. Dữ liệu thiếu ảnh xoài thì AI không nhận ra xoài, và có thể đoán sai thành 1 loại quả nó đã biết. AI thường không tự biết là mình chưa học, nên nó vẫn đoán như thường."
      en: "AI only knows what is in the data it learned from. With no mango photos in the data, the AI cannot recognize a mango, and it may guess wrong with a fruit it knows. An AI often does not know that it has not learned something, so it still makes a guess."
