concepts:
  - id: var-assign
    name: { vi: "Dấu = là gán, không phải so sánh", en: "= assigns, it does not compare" }
    misconception_card: |
      Nhiều bạn đọc `diem = 5` là "diem bằng 5" như ở môn Toán. Thực ra dấu `=` là lệnh **gán**: lấy giá trị ở bên phải, rồi cất vào biến ở bên trái. Vì vậy tên biến luôn đứng bên trái: viết `5 = diem` thì Python báo lỗi. Khi in, tên biến không có dấu nháy: `print(diem)` in ra 5, còn `print("diem")` in ra chữ diem.
    parent_tip: |
      Lấy 1 hộp giấy, dán nhãn ghi "diem", rồi bỏ vào hộp 1 mảnh giấy ghi số 5. Hỏi con: "Trong hộp diem có gì?". Con trả lời 5, chứ không phải chữ diem. Lệnh gán giống việc bỏ mảnh giấy vào hộp.
    practice:
      level1: [s2.bien.l1.q1, s2.bien.l1.q2, s2.bien.b1, s2.bien.b2, s2.bien.b3, s2.bien.b4]
      level2: [s2.bien.p1]
      level3: [s2.bien.l1.ex1, s2.bien.c2, s2.bien.l4.ex1]
  - id: var-name-rules
    name: { vi: "Quy tắc đặt tên biến", en: "Rules for variable names" }
    misconception_card: |
      Nhiều bạn nghĩ tên biến viết thế nào cũng được, như `so keo` hay `2ten`. Thực ra tên biến chỉ gồm chữ cái, chữ số và dấu gạch dưới `_`, và không được bắt đầu bằng chữ số. Muốn ghép nhiều từ, con nối bằng dấu gạch dưới: `so_keo`. Python cũng phân biệt chữ hoa và chữ thường, nên `ten` và `Ten` là 2 biến khác nhau.
    parent_tip: |
      Cùng con làm nhãn tên cho các hộp đồ chơi, với luật: chỉ viết liền, nối các từ bằng dấu gạch dưới, và không bắt đầu bằng số, ví dụ "hop_but" hay "xe_do_choi". Bố mẹ thử viết vài nhãn sai luật để con tìm lỗi.
    practice:
      level1: [s2.bien.l2.q1, s2.bien.l2.q2, s2.bien.b5, s2.bien.b6, s2.bien.b7, s2.bien.b8, s2.bien.b9]
      level2: [s2.bien.p2]
      level3: [s2.bien.l2.ex1]
  - id: var-reassign
    name: { vi: "Biến giữ giá trị gán sau cùng", en: "A variable keeps the last value assigned" }
    misconception_card: |
      Nhiều bạn nghĩ biến nhớ được cả giá trị cũ, hoặc nghĩ chỉ viết `xu + 3` là biến xu tự tăng. Thực ra mỗi biến chỉ giữ **1 giá trị**: gán lại thì giá trị cũ mất. Muốn đổi giá trị, con phải gán lại: `xu = xu + 3`. Python tính vế phải bằng giá trị cũ trước, rồi mới cất kết quả vào biến. Lệnh print in giá trị của biến ở đúng lúc nó chạy.
    parent_tip: |
      Viết số 5 lên 1 tấm bảng nhỏ. Mỗi lần con nhặt thêm 1 viên kẹo, con xóa số cũ và viết số mới vào. Tấm bảng luôn chỉ có 1 số, là số mới nhất, giống như 1 biến.
    practice:
      level1: [s2.bien.l3.q1, s2.bien.l3.q2, s2.bien.b10, s2.bien.b11, s2.bien.b12]
      level2: [s2.bien.p3, s2.bien.p4]
      level3: [s2.bien.l3.ex1, s2.bien.c3]
  - id: var-before-use
    name: { vi: "Phải gán biến trước khi dùng", en: "Assign a variable before you use it" }
    misconception_card: |
      Nhiều bạn nghĩ biến chưa gán thì tự có giá trị 0, hoặc nghĩ Python đọc trước cả chương trình để tìm giá trị. Thực ra Python chạy từ trên xuống: dùng biến khi nó chưa được gán thì Python báo lỗi **NameError**. Ví dụ `print(tuoi)` đặt trước `tuoi = 11` sẽ bị lỗi. Con sửa bằng cách đặt dòng gán lên trên dòng dùng biến.
    parent_tip: |
      Nhờ con lấy đồ từ chiếc hộp có nhãn "hop_keo" khi trong nhà chưa có hộp nào như vậy. Con sẽ thấy phải chuẩn bị hộp và bỏ kẹo vào trước, rồi mới lấy ra được. Biến cũng phải được gán trước rồi mới dùng.
    practice:
      level1: [s2.bien.l3.q3, s2.bien.b13, s2.bien.b14]
      level2: [s2.bien.p4]
      level3: [s2.bien.c1]
  - id: str-vs-int
    name: { vi: "Biến chứa chuỗi \"5\" khác biến chứa số 5", en: "A variable holding \"5\" is not one holding 5" }
    misconception_card: |
      Nhiều bạn nghĩ `a = "5"` và `a = 5` giống nhau, vì nhìn đều thấy số 5. Thực ra `"5"` có dấu nháy là 1 **chuỗi** (str), còn `5` là 1 **số nguyên** (int). Vì vậy dấu `+` làm việc khác nhau: 2 số thì cộng (`5 + 3` ra 8), còn 2 chuỗi thì nối (`"5" + "3"` ra 53). Muốn biết biến chứa loại gì, con dùng `type()`.
    parent_tip: |
      Đưa con 2 tấm thẻ ghi chữ số 5 và 3, cùng 5 viên kẹo và 3 viên kẹo. Đặt 2 tấm thẻ cạnh nhau thì đọc được 53. Gộp kẹo lại thì đếm được 8. Chuỗi giống tấm thẻ, còn số giống những viên kẹo.
    practice:
      level1: [s2.bien.l4.q1, s2.bien.l4.q2, s2.bien.b15, s2.bien.b16, s2.bien.b17, s2.bien.b18, s2.bien.b19]
      level2: [s2.bien.p5]
      level3: [s2.bien.l4.ex2, s2.bien.l4.ex1]
  - id: ai-data
    name: { vi: "AI cần dữ liệu tốt", en: "AI needs good data" }
    ai: true
    misconception_card: |
      Nhiều bạn nghĩ AI tự biết mọi thứ, hoặc học từ dữ liệu nào cũng giỏi như nhau. Thực ra AI học từ **dữ liệu**: rất nhiều ví dụ có **nhãn** ghi đáp án đúng. Nếu nhãn bị ghi sai, hoặc dữ liệu bị thiếu, AI sẽ học sai và trả lời sai. Dữ liệu tốt là dữ liệu nhiều, đa dạng và có nhãn đúng.
    parent_tip: |
      Cùng con chơi trò dạy "robot" phân loại: bố mẹ đóng vai robot chỉ được xem vài tấm ảnh táo đỏ. Khi con đưa ảnh táo xanh, "robot" lắc đầu không nhận ra. Hỏi con cần cho robot xem thêm những ảnh nào.
    practice:
      level1: [s2.bien.l5.q1, s2.bien.l5.q2, s2.bien.b20, s2.bien.b21, s2.bien.b22, s2.bien.b23]
